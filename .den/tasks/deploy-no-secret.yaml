do: |
  THE JOB: In web/scripts/deploy.sh the lftp call is `lftp -c "... open -u '$DEPLOY_USER','$DEPLOY_PASS' '$DEPLOY_HOST'; mirror ..."`,
  so the FTP password sits in lftp's argv (visible in `ps`) and can be echoed by verbose/dry-run
  output. Change it so the password never appears in argv, stdout or stderr. Do it by writing the
  lftp command script to a temp file created with `umask 077; mktemp`, run `lftp -f "$file"`,
  and remove the file with a `trap ... EXIT` (also on failure). Keep every existing setting and
  behaviour: the `set ftp:*`/`ssl:*`/`net:*` lines, `set cmd:fail-exit true`, the mirror flags,
  exclusions, DEPLOY_SSL_VERIFY, the proxy-env scrubbing (`env -u ...`), --dry-run and
  --skip-build. Also make sure no `log`/`echo`/`die` message prints DEPLOY_PASS. If `set cmd:verbose`
  or any option makes lftp echo script lines, turn it off (`set cmd:verbose false` is not needed
  unless lftp echoes; test with the stub below to see what is printed by the script itself).
  THE WHY: the managing agent (2026-10-18) found --dry-run and verbose output print the FTP password in
  clear text. A credential must never reach logs or the process list.
  GUARDRAILS: Do not run the real deploy or connect to the real host. Do not read or print
  ~/.config/lavigne-labs/deploy.env. Do not change deploy.env.example's structure (no real
  secrets in the repo). Touch only web/scripts/deploy.sh (and a doc line if one describes the old
  behaviour). Do not commit any credential.
  DONE MEANS: running `deploy.sh --dry-run --skip-build` against a FAKE env file (mode 600, fake
  host, password string "PW-CANARY-9f3k2") shows that string in none of stdout, stderr, or lftp's
  argv, while lftp still receives it inside its -f script file.
done_when: |
  set -u
  T=$(mktemp -d); trap 'rm -rf "$T"' EXIT
  mkdir -p "$T/bin" "$T/out"
  cat > "$T/bin/lftp" <<'STUB'
  #!/usr/bin/env bash
  # records argv, and the content of any -f script file, without printing either
  printf '%s\n' "$@" >> "$LOG_ARGV"
  while [ $# -gt 0 ]; do if [ "$1" = "-f" ]; then cat "$2" >> "$LOG_SCRIPT"; fi; shift; done
  exit 0
  STUB
  chmod +x "$T/bin/lftp"
  umask 077
  cat > "$T/deploy.env" <<ENV
  DEPLOY_HOST=127.0.0.1
  DEPLOY_USER=fakeuser
  DEPLOY_PASS=PW-CANARY-9f3k2
  DEPLOY_REMOTE_DIR=/public_html
  DEPLOY_VERIFY_URL=http://127.0.0.1:9
  ENV
  chmod 600 "$T/deploy.env"
  : > "$T/argv.log"; : > "$T/script.log"
  cd web
  mkdir -p out && touch out/.probe
  PATH="$T/bin:$PATH" LOG_ARGV="$T/argv.log" LOG_SCRIPT="$T/script.log" LAVIGNE_DEPLOY_ENV="$T/deploy.env" \
    bash scripts/deploy.sh --dry-run --skip-build >"$T/stdout" 2>"$T/stderr"; rc=$?
  rm -f out/.probe
  [ $rc -eq 0 ] || { echo "deploy.sh --dry-run exited $rc"; cat "$T/stderr"; exit 1; }
  ! grep -rq 'PW-CANARY-9f3k2' "$T/stdout" "$T/stderr" "$T/argv.log" || { echo "password leaked"; exit 1; }
  grep -q 'PW-CANARY-9f3k2' "$T/script.log" || { echo "lftp never received the password via -f script"; exit 1; }
  grep -q 'mirror' "$T/script.log" && grep -q 'ftp:ssl-force true' "$T/script.log"
protected: [".den/**"]
runaway: {minutes: 20}
