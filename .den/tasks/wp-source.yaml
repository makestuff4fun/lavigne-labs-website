do: |
  THE JOB: Rebuild the /work project text from Brian's ORIGINAL WordPress database dumps, which outrank the Wayback text.
  Sources (read in place, never copy into the repo): ~/.local/share/lavigne-labs/wp-backup/lavignelabs_wp.sql (main site,
  18 MB) and ~/.local/share/lavigne-labs/wp-backup/lavignel_wordpress.sql (second, smaller DB; check it too). Parse with a
  Python script over the INSERT statements (keep the script in /tmp, parse wp_posts and wp_postmeta by hand-rolled SQL
  tuple parsing, or load into a throwaway mysql:8 container / temp datadir under /tmp). Do NOT use red's MySQL on :3306
  and touch no live database. For each of the 12 slugs in web/content/projects.ts find the portfolio item (post_type
  like portfolio/project/post; match by title to the existing web/content/projectDetails.ts text) and take: title, full
  post_content with theme shortcodes stripped to clean Markdown (keep headings, lists, bold; drop [vc_*]/[et_*]-style
  shortcodes but keep the text inside them), excerpt, publish date, the featured image (_thumbnail_id) and gallery
  attachment IDs (gallery meta or ids="..." in shortcodes or attachments whose post_parent is the item), each resolved to
  its filename (attachment guid /wp-content/uploads/YYYY/MM/name.jpg). Write one public file per project:
  docs/work-sources/wp/<slug>.json = {slug, wpTitle, wpPostId, text (clean Markdown), excerpt, date, featured, images:[filenames]}
  and docs/work-sources/wp/README.md noting the source dump names and parse method. NOTHING else from the dumps goes in the
  repo: no users, emails, password hashes, options, comments, drafts of other posts.
  Then (1) update web/content/projectDetails.ts: for each slug whose WP text exists, replace description with the WP text,
  set verified: true, sourceUrl to "original WordPress database (export 2026-10-18)", keep the Wayback images list. Where
  Wayback and WP differ materially, WP wins; append a line to docs/work-sources/DISCREPANCIES.md. Slugs with no WP match
  keep the Wayback text and verified false; list them in docs/work-sources/WP-MISSING.md. (2) Replace the 8 inferred
  blurbs in web/content/projects.ts (microscope-slider, micropython-system, camera-arm, mechanical-keyboard,
  whiteboard-plotter, hex-puck-lights, custom-dog-leashes, handheld-sokoban, plus any other the DISCREPANCIES.md file says
  contradicts) with 1-2 sentence blurbs taken from the WP excerpt/first paragraph, using only facts the text states.
  Remove the "inferred" flag/comment if there is one. (3) Image top-up: web/content/projectGalleries.ts and
  web/public/work/<slug>/ already hold a gallery from the previous task. For each slug, compare the WP image filenames
  with `rclone lsf "onedrive2:Lavigne Labs/Website/Images"` (READ-ONLY: rclone lsf and rclone copy to a /tmp dir only; never
  write, move, delete on OneDrive) and the per-project folders under `onedrive2:Lavigne Labs`. Where a WP image exists on
  OneDrive and is not yet in that project's gallery, add it (same rules: long edge <= 1600 px, JPEG, <= 300000 bytes, alt
  text from actually viewing it with Read, max 6 per project, 01.jpg numbering continues). Do not remove existing gallery
  images. List any WP filename found nowhere in docs/work-sources/wp/IMAGES-NOT-FOUND.md.
  THE WHY: the managing agent recovered the original WordPress database (2026-10-18); Brian wants /work detail pages
  that match what the old site really said ("the work page used to have details about each project and images"). This
  also answers the open question about the 8 inferred blurbs, so Brian does not have to. The detail pages are the next task.
  GUARDRAILS: The dumps are PRIVATE (user rows, emails, password hashes). Never commit a dump, a fragment of one, or any
  email or hash; the only things leaving them are the public project text, titles, dates and image filenames. Do not touch
  app/components, do not deploy. OneDrive read-only. No invented project facts: if the WP text is thin, keep it thin.
  DONE MEANS: docs/work-sources/wp/<slug>.json exists for every matched project with real text; projectDetails.ts uses it
  (verified true) ; the inferred blurbs are replaced with WP-derived text; galleries topped up; no private data in the repo.
done_when: |
  python3 - <<'PY'
  import re,json,os,subprocess
  slugs=re.findall(r'slug:\s*"([^"]+)"',open('web/content/projects.ts',encoding='utf8').read())
  assert len(slugs)==12
  miss=open('docs/work-sources/WP-MISSING.md',encoding='utf8').read() if os.path.exists('docs/work-sources/WP-MISSING.md') else ''
  d=open('web/content/projectDetails.ts',encoding='utf8').read()
  found=0
  for s in slugs:
      p=f'docs/work-sources/wp/{s}.json'
      if s in miss: continue
      j=json.load(open(p,encoding='utf8'))
      assert len(j['text'])>=200 and j['wpPostId'] and j['images']!=None,(s,'thin')
      found+=1
  assert found>=8,found
  assert d.count('verified: true')+d.count('"verified": true')>=found,'verified flags'
  assert 'original WordPress database' in d
  pr=open('web/content/projects.ts',encoding='utf8').read()
  assert 'motorized X/Y stage' not in pr and 'custom driver board' not in pr
  tracked=subprocess.run(['git','ls-files'],capture_output=True,text=True).stdout.split()
  blob=''.join(open(f,encoding='utf8',errors='ignore').read() for f in tracked if f.startswith('docs/work-sources/'))
  assert '$P$' not in blob and '$wp$' not in blob and 'user_pass' not in blob and 'user_email' not in blob
  assert not any(f.endswith('.sql') for f in tracked)
  PY
needs: [work-images]
protected: [".den/**"]
runaway: {minutes: 60}
