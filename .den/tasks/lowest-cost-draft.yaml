do: |
  THE JOB: Write a DRAFT article saved at docs/drafts/lowest-cost-manufacturing-china.md (NOT in
  web/content/articles/, so it cannot ship). Read all three existing articles in web/content/articles/ first
  (vetting-a-factory.md, what-landed-cost-includes.md, yes-doesnt-always-mean-yes.md) and match their voice (first
  person, Brian, practical, plain headings, no hype) and gray-matter frontmatter: title, date "2026-10-18",
  tag "Sourcing", excerpt. Put an HTML comment right after the frontmatter:
  <!-- DRAFT: Brian must read before this moves to web/content/articles/ -->. Length 1,000-1,800 words.
  Name and state "Brian's Law" exactly as: "If the factory can deal with you in English, you can find a lower price."
  Explain why: an English-speaking sales team and trading-company layers are overhead and a sign of middlemen; the
  real maker is often a smaller factory one or two tiers down. Cover, in sensible sections: (1) big factories
