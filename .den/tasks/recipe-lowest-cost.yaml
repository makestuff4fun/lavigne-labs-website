do: |
  THE JOB: Revise docs/drafts/lowest-cost-manufacturing-china.md to the recipe-not-ingredients strategy. Keep it generous: the "How to find and vet them" and checklist parts should be concrete (real steps, real Chinese terms where they fit, what to ask, what to verify in person). Let the hard parts show naturally (reading the real factory vs the trading front, visiting in person, Chinese, payment, trust built over years). Rewrite "Closing thought" as the CTA in the strategy's spirit: you can do this yourself and here is how; or we can do it faster and better because we already have the relationships and are on the ground. Keep Brian's Law with its exact sentence "If the factory can deal with you in English, you can find a lower price." 1,000-1,800 words.
  THE WHY: Brian's editorial strategy for every article (2026-10-18), verbatim: "The shops and suppliers don't need to be named. We are giving a recipe not the ingredients. The point is to give away the recipe but in a way that's hard to execute. Most readers aren't in china, don't speak chinese and can't do these things. It seems like giving away the secrets but it's really clever "honest advertising". I know what to do, I'll tell you what I do, but if you're not me, I can still do it better. I have years of existing relationships with trusted suppliers." So: be genuinely generous and specific (real steps, real Chinese search terms, real timelines; it must read as honest, not a teaser), name no shops or suppliers, let the hard parts show naturally without bragging (being on the ground in China, speaking Chinese, visiting in person, payment and accounts, and above all years of trusted supplier relationships that cannot be bought), and let the close turn that into the CTA: you can do this yourself, and here is how; or we can do it faster and better because we already have the relationships. Warm and confident, never salesy.
  GUARDRAILS: Stay a DRAFT in docs/drafts/ (do not move into web/content/articles/, no publish, no deploy). Keep the frontmatter fields (title, date, tag, excerpt, and author if present) and the DRAFT comment. Keep every existing exact phrase the draft already carries (pull quotes, Brian's Law sentence, byline and sign-off). Do not add invented numbers, prices or statistics, and do not name any company, shop, supplier or person other than Brian in Brian's Law. Do not touch other drafts or any other file.
  DONE MEANS: the draft follows the strategy and the checks pass.
done_when: |
  python3 - <<'PY'
  import re,sys
  t=open('docs/drafts/lowest-cost-manufacturing-china.md',encoding='utf8').read()
  fm=t.split('---',2)[1]; body=t.split('---',2)[2]
  txt=re.sub(r'<!--.*?-->','',body,flags=re.S)
  n=len(re.findall(r"\S+",txt))
  assert 1000<=n<=1800,n
  assert 'DRAFT' in body
  bad=re.findall(r"Co\.,? ?Ltd|\bLtd\b|\bInc\.|\bLLC\b|Foxconn|Huawei|\bDJI\b|Xiaomi|Shenzhen [A-Z][a-z]+ (?:Tech|Electronics)|JLC",txt)
  assert not bad,bad
  last=txt.split('\n## ')[-1].lower()
  assert re.search(r"relationship|on the ground|in person|in china",last),'closing must mention relationships / on the ground'
  assert re.search(r"relationship",last),'closing must mention relationships'
  assert re.search(r"/contact/",last),'closing needs contact pointer'
  assert 'yourself' in last and 'faster and better' in last,'closing needs the do-it-yourself / faster-and-better CTA'
  assert "Brian's Law" in body and "If the factory can deal with you in English, you can find a lower price." in body
  PY
protected: [".den/**"]
