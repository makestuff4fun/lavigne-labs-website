do: |
  THE JOB: Add a detail page per project at /work/<slug>/ and point the cards at it. Data: web/content/projects.ts (title,
  blurb, tags, card image), web/content/projectDetails.ts (recovered description, Markdown), web/content/projectGalleries.ts
  (gallery images with alt/width/height). Read web/node_modules/next/dist/docs/ first (Next 16: app/work/[slug]/page.tsx with
  generateStaticParams, dynamicParams = false, async params). Render with the site's existing Container/Eyebrow components
  and Tailwind patterns (see app/articles/[slug] for how Markdown is rendered with `marked`; reuse that, do not add a
  dependency). Page: breadcrumb/back link "← All work" to /work/, h1, tags, a gallery grid of <img> (use plain <img> with
  width/height, loading="lazy" except the first; static export has no image optimizer), the description, and a
  line "Description recovered from the original site" only where verified is false. Add per-page metadata (title,
  description from blurb, openGraph image = first gallery image) and Project JSON-LD: schema.org CreativeWork with name,
  description (blurb), image[], keywords (tags), author (Person Brian Barrett), url (pageUrl()).
  Change the work grid cards (components/ProjectCard.tsx and wherever FeaturedWork/work page use it) to link to
  /work/<slug>/ (via pageUrl-style trailing slash) instead of the image file. Add the 12 pages to app/sitemap.ts, to
  llms.txt and llms-full.txt (a "Work" section: title, URL, blurb), to /api/v1/portfolio.json (each project gains url
  to its detail page and gallery image URLs; keep existing fields), and to search-index.json (type "project", url to the
  detail page, text = blurb + description). Update the OpenAPI/schemas if portfolio shape changes (openapi.json is
  generated from the REGISTRY; keep its check passing).
  THE WHY: Brian (2026-10-18): "the work page used to have details about each project and images. but it's not
  working." /work was only cards linking to bare JPGs. Step 3 of 3.
  GUARDRAILS: Do not deploy. Do not invent text: show only what projectDetails.ts holds (if a description is empty,
  show the blurb only). Keep /work, /api/v1 and existing pages working; `npm run lint` must not gain errors beyond the
  known game-component ones.
  DONE MEANS: after `cd web && npm run export`, every project has out/work/<slug>/index.html with >= 3 <img> whose files
  exist under out/, with non-empty text and CreativeWork JSON-LD; no card on /work or the home page links to an image
  file; sitemap, llms.txt, portfolio.json and search-index.json include the pages.
done_when: |
  cd web && npm run export >/tmp/work-pages-export.log 2>&1 && python3 - <<'PY'
  import re,json,os
  slugs=re.findall(r'slug:\s*"([^"]+)"',open('content/projects.ts',encoding='utf8').read())
  assert len(slugs)==12
  short=open('../docs/work-sources/IMAGES-SHORT.md',encoding='utf8').read() if os.path.exists('../docs/work-sources/IMAGES-SHORT.md') else ''
  for s in slugs:
      h=open(f'out/work/{s}/index.html',encoding='utf8').read()
      imgs=re.findall(r'<img[^>]+src="([^"]+)"',h)
      gal=[i for i in imgs if f'/work/{s}/' in i]
      if s not in short: assert len(gal)>=3,(s,len(gal))
      for i in gal: assert os.path.exists('out'+i.split('lavignelabs.com')[-1]),(s,i)
      assert 'All work' in h
      ld=[json.loads(x) for x in re.findall(r'<script type="application/ld\+json">(.*?)</script>',h,re.S)]
      cw=[x for x in ld if x.get('@type')=='CreativeWork']
      assert cw and cw[0]['name'] and cw[0]['description'] and cw[0]['image'],s
      body=re.sub(r'<[^>]+>',' ',re.sub(r'(?s)<(script|style).*?</\1>','',h))
      assert len(body.split())>150,(s,len(body.split()))
  for page in ('out/work/index.html','out/index.html'):
      h=open(page,encoding='utf8').read()
      assert not re.search(r'<a[^>]+href="[^"]+\.(?:jpg|jpeg|png|webp)"',h),page
      assert any(f'/work/{s}/' in h for s in slugs),page
  sm=open('out/sitemap.xml',encoding='utf8').read()
  llms=open('out/llms.txt',encoding='utf8').read()
  pf=json.load(open('out/api/v1/portfolio.json',encoding='utf8'))
  si=json.load(open('out/api/v1/search-index.json',encoding='utf8'))
  recs=si.get('records') or si.get('index')
  for s in slugs:
      assert f'/work/{s}/' in sm,('sitemap',s)
      assert f'/work/{s}/' in llms,('llms',s)
      assert any(f'/work/{s}/' in json.dumps(p) for p in pf['projects']),('portfolio',s)
      assert any(r['type']=='project' and f'/work/{s}/' in r['url'] for r in recs),('search',s)
  PY
needs: [work-images]
protected: [".den/**"]
runaway: {minutes: 45}
