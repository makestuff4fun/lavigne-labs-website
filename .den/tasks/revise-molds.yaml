do: |
  THE JOB: Revise docs/drafts/fast-injection-molds.md under Brian's editorial mandate. (1) Correct spelling and grammar silently. (2) Correct anything Brian got wrong (facts, physics, terms) and say so in the review note. (3) Enhance: structure, a stronger hook, clearer examples, same voice. (4) Add the knowledge he missed, where solid and well established. For this mold piece, consider and (where solid) add, in plain recipe language: why fast molds wear (softer tool steel such as P20 or aluminium for short runs, versus hardened H13/S136 for long runs; sometimes the steel is pre-hardened and not heat-treated, and soft or small-core tooling wears first at the gate and parting line); draft angles and why the part design must have them; gate and ejector-pin marks (where they land on a cosmetic part, so say so up front); surface texture/finish specs (SPI A/B/C/D polish grades, MT texture standard numbers, VDI 3400) and that texture adds time and cost; first-article samples (T0/T1) and what to check on them (fit, shrinkage, warpage, flash); material and shrinkage choice affecting fit; and that DFM feedback on the 3D file should come before steel is cut. Check Brian's physics: steel-safe wording; "fast mold vs aluminium tool" claims. Keep his numbers exactly (30+15 days, 10 days, 5,000 parts in 14 days, ~20,000 shots, $2-3k vs $5-10k) and the final question.
  THE REVIEW NOTE: put it first in the file, right after the frontmatter, as one HTML comment block that starts with `<!-- REVIEW NOTE` and ends with `-->` (it is stripped before publishing), with three labelled parts: "Corrected:" (spelling/grammar in one line, then each factual/physics/term correction of Brian's, said plainly), "Added:" (each piece of knowledge you added), "Unsure:" (anything you could not confirm, or "nothing"). Short, plain, so Brian can approve in one read.
  THE WHY: Brian's standing EDITORIAL MANDATE (2026-10-18), verbatim: "of course, correct spelling, correct me, enhance, add knowledge you know that I missed." Together with his editorial strategy ("The shops and suppliers don't need to be named. We are giving a recipe not the ingredients. The point is to give away the recipe but in a way that's hard to execute... clever 'honest advertising'. I know what to do, I'll tell you what I do, but if you're not me, I can still do it better. I have years of existing relationship with trusted suppliers."), see docs/CONTENT.md. Brian wants to approve each article in one read, so the changes must be visible in the note.
  GUARDRAILS: Stay a DRAFT in docs/drafts/ (no publish, no deploy, touch no other file). Keep frontmatter fields (including series/related fields if present), the DRAFT comment, every exact phrase the draft already carries (pull quotes, Brian's Law sentence, byline, sign-off, closing lines, the closing question) and the closing CTA shape (do it yourself, here is how; or we do it faster and better because of relationships and being on the ground; link /contact/). Name no company, shop or supplier (JLC only where it already appears and Brian named it). Add only knowledge that is solid and well established; anything you are not sure of goes in the review note under "Unsure", not in the body. Never invent numbers, prices or statistics; Brian's own numbers stay exactly as written. It must stay recipe, not ingredients.
  DONE MEANS: the draft is better, correct, still recipe-not-ingredients, with an honest review note at the top.
done_when: |
  python3 - <<'PY'
  import re
  t=open('docs/drafts/fast-injection-molds.md',encoding='utf8').read()
  fm=t.split('---',2)[1]; rest=t.split('---',2)[2]
  m=re.match(r"\s*<!-- REVIEW NOTE(.*?)-->",rest,flags=re.S)
  assert m,'review note must come first after frontmatter'
  note=m.group(1)
  for k in ('Corrected:','Added:','Unsure:'): assert k in note,k
  assert len(re.findall(r"\S+",note))>=40,'note too thin'
  body=rest[m.end():]
  txt=re.sub(r'<!--.*?-->','',body,flags=re.S)
  n=len(re.findall(r"\S+",txt)); assert 1000<=n<=2000,n
  assert 'DRAFT' in body
  bad=re.findall(r"Co\.,? ?Ltd|\bLtd\b|\bInc\.|\bLLC\b|Foxconn|Huawei|\bDJI\b|Xiaomi|Ningbo|Yuyao|Taizhou|Huangyan|Hangzhou|Wenzhou",txt)
  assert not bad,bad
  last=txt.split('\n## ')[-1].lower()
  assert 'relationship' in last and 'yourself' in last and 'faster and better' in last and '/contact/' in last
  assert re.search(r"P20|H13|aluminium|aluminum",txt) and re.search(r"draft angle",txt,re.I) and re.search(r"ejector|gate mark",txt,re.I) and re.search(r"SPI|VDI|\bMT\b|texture",txt) and re.search(r"T1|T0|first[- ]article",txt)
  assert txt.rstrip().endswith('Could this speed up your first production batch?')
  for k in ('5,000','14 days','$2','Zhejiang','20,000','$5','30 days','15 days'): assert k in txt,k
  PY
protected: [".den/**"]
runaway: {minutes: 30}
needs: [contact-mailto]
