do: |
  THE JOB: Generate print-ready, vector-text PDFs of the four shop charts at build time, in A4 and US Letter, into out/tools/charts/<slug>-a4.pdf and out/tools/charts/<slug>-letter.pdf (slugs: metric-tap-drills, inch-tap-drills, decimal-equivalents, cheat-sheet; 8 files). Hook it into `npm run export` (web/scripts/export-static.sh or a node script it calls) after the pages are built.
  Method: headless Chromium print-to-PDF of the built chart pages (or a dedicated print layout of the same data). Chromium is on this box: ~/.cache/ms-playwright/chromium_headless_shell-1234/chrome-headless-shell-linux64/chrome-headless-shell (flags: --headless --no-pdf-header-footer --print-to-pdf=FILE file:///.../index.html; use @page { size: A4 } / { size: Letter } via a query/class per variant). Do not depend on the playwright npm package unless it is already a dependency; do not add a heavy dependency. Resolve the binary from an env var CHROME_BIN, falling back to that path, and FAIL the export loudly with a clear message if it is missing. Text must be real vector text with fonts embedded (not screenshots); use locally bundled/system fonts so no network is needed. Margins about 10-12 mm, content scaled to fit. metric-tap-drills, inch-tap-drills and decimal-equivalents should be 1 page each where legible at arm's length (at most 2 pages; never tiny), cheat-sheet exactly 1 page. Each PDF carries the small Lavigne Labs mark, the diagrams (where the page has them), and the footer URL, and has document title metadata.
  THE WHY: Brian (2026-10-18): "make them downloadable PDF that can be printed A4 or letter". They hang on shop walls and are used at a drill press, so sizes and fidelity matter more than looks.
  GUARDRAILS: do not alter the data values or the page tables. Generated PDFs are build artifacts (out/ is git-ignored) - do not commit them. Keep `npm run export` working and idempotent. No deploy.
  DONE MEANS: all 8 PDFs exist in out/tools/charts/, correct page size and counts, and pdftotext of each shows the known tap/clearance values.
done_when: |
  set -e
  cd web && npm run export >/tmp/charts-pdf.log 2>&1 || { tail -30 /tmp/charts-pdf.log; exit 1; }
  python3 - <<'PY'
  import subprocess,re
  D='out/tools/charts/'
  def info(f): return subprocess.run(['pdfinfo',f],capture_output=True,text=True,check=True).stdout
  def txt(f): return subprocess.run(['pdftotext','-layout',f,'-'],capture_output=True,text=True,check=True).stdout
  size={'a4':(595.0,842.0),'letter':(612.0,792.0)}
  maxp={'metric-tap-drills':2,'inch-tap-drills':2,'decimal-equivalents':2,'cheat-sheet':1}
  for s,mp in maxp.items():
      for v,(w,h) in size.items():
          f=f'{D}{s}-{v}.pdf'
          i=info(f)
          m=re.search(r'Page size:\s+([\d.]+) x ([\d.]+)',i); assert m,(f,i)
          assert abs(float(m[1])-w)<=2 and abs(float(m[2])-h)<=2,(f,m[0])
          n=int(re.search(r'Pages:\s+(\d+)',i)[1]); assert 1<=n<=mp,(f,n)
          t=txt(f); assert len(t.strip())>200,(f,'no vector text')
          assert 'lavignelabs.com' in t,(f,'footer url')
          fonts=subprocess.run(['pdffonts',f],capture_output=True,text=True).stdout
          assert not re.search(r'\bno\s+no\s',fonts.split('\n',2)[-1]) or all(l.split()[-5]=='yes' for l in fonts.strip().split('\n')[2:] if len(l.split())>=6),(f,fonts)
  for v in size:
      t=re.sub(r'\s+',' ',txt(f'{D}metric-tap-drills-{v}.pdf'))
      for pat in [r'M3\D{1,40}0\.5\D{1,80}2\.5\b',r'M4\D{1,40}0\.7\D{1,80}3\.3\b',r'M5\D{1,40}0\.8\D{1,80}4\.2\b',r'M6\D{1,40}1\D{1,80}5\.0?\b',r'M8\D{1,40}1\.25\D{1,80}6\.8\b',r'M10\D{1,40}1\.5\D{1,80}8\.5\b']: assert re.search(pat,t),(v,pat)
      t=re.sub(r'\s+',' ',txt(f'{D}inch-tap-drills-{v}.pdf'))
      assert re.search(r'1/4\D{1,4}20\D{1,80}#7\D{1,40}0\.201',t) and re.search(r'10\D{1,4}32\D{1,80}#21\D{1,40}0\.159',t),v
      t=re.sub(r'\s+',' ',txt(f'{D}decimal-equivalents-{v}.pdf'))
      assert re.search(r'#7\D{1,20}0\.2010?',t) and re.search(r'\bF\b\D{1,20}0\.2570?',t) and re.search(r'1/4\D{1,20}0\.25\D{1,20}6\.35',t),v
  PY
protected: [".den/**"]
runaway: {minutes: 60}
needs: [charts-pages]
