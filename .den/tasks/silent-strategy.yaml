done_when: |
  python3 - <<'PY'
  import re,glob
  fs=glob.glob('docs/drafts/*.md'); assert len(fs)>=6,fs
  banned=["easy to show","hard to execute","do it yourself, or","why you need","better than you","we can do it faster","faster and better","do it with us","can't copy from an article"]
  for f in fs:
      t=open(f,encoding='utf8').read()
      body=re.sub(r'<!--.*?-->','',t,flags=re.S).lower()
      for b in banned: assert b not in body,(f,b)
      last=body.strip().split('\n## ')[-1]
      assert '/contact/' in body,(f,'no contact link')
      tail=body.strip()[-700:]
      assert '/contact/' in tail or 'further reading' in body,(f,'closing CTA missing')
  c=open('docs/CONTENT.md',encoding='utf8').read()
  assert 'silent' in c.lower() and 'We don\'t say that part out loud' in c
  assert 'Let the close turn that into the CTA' not in c
  PY
