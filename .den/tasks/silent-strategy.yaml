  GUARDRAILS: Edit only docs/CONTENT.md and files in docs/drafts/. No publish, no deploy, no web/ changes. Do not shorten the recipe content; word counts may drop only by the removed pitch lines. Keep frontmatter, DRAFT comment, review note (first after frontmatter), internal links (/contact/, series cross-links), and the Further reading section of the snap-fits draft with its links. Name no company, shop or supplier.
