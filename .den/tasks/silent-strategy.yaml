ause they are his voice: "This is the stuff no one explains to you. We've learned all the lessons the hard way, so you won't have to."; the molds closing question; "Don't tell anyone you heard it from me."; the Taobao king/inside-joke lines; "Unless you're an expert, you're likely doing it wrong." (that last one is about draft angles, a field rule, not the meta message). If you keep a borderline line, say so in that draft's review note. Add one line to each draft's review note under Corrected: "Closing reduced to a plain CTA; pitch lines removed per Brian." Keep every review note's Corrected/Added/Unsure shape. (3) Do not reintroduce draft-angle advice.
