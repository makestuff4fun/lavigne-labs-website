<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360" role="img" aria-labelledby="ef-t ef-d">
<title id="ef-t">Head camera field of view: narrow versus wide lens</title>
<desc id="ef-d">Side view of a person at a bench, looking at the task. A narrow lens centred on their gaze covers the task but not their hands, which sit close to the body and lower in the view. A wide lens covers both the task and the hands.</desc>
<defs>
<pattern id="ef-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e2e8f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2"/></pattern>
</defs>
<rect width="640" height="360" fill="#f4f6fb"/>
<path d="M174 80 L472 0 L640 0 L640 360 L198 360 Z" fill="#2563eb" fill-opacity="0.10" stroke="#2563eb" stroke-width="1.5"/>
<path d="M174 80 L640 188 L640 360 L356 360 Z" fill="#f59e0b" fill-opacity="0.16" stroke="#b45309" stroke-width="1.5" stroke-dasharray="6 4"/>
<line x1="174" y1="80" x2="420" y2="252" stroke="#1b2942" stroke-width="1.5" stroke-dasharray="2 4"/>
<rect x="210" y="250" width="410" height="12" fill="url(#ef-hatch)" stroke="#475569" stroke-width="2"/>
<line x1="232" y1="262" x2="232" y2="360" stroke="#475569" stroke-width="2.5"/>
<line x1="598" y1="262" x2="598" y2="360" stroke="#475569" stroke-width="2.5"/>
<rect x="402" y="230" width="36" height="20" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
<g fill="#dbeafe" stroke="#1b2942" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
<circle cx="148" cy="90" r="24"/>
<path d="M136 116 L162 116 L166 262 L132 262 Z"/>
<path d="M152 134 L182 202 L245 246" fill="none" stroke-width="7"/>
<line x1="140" y1="262" x2="138" y2="360" stroke-width="7"/>
<line x1="158" y1="262" x2="164" y2="360" stroke-width="7"/>
</g>
<circle cx="252" cy="248" r="7" fill="#dbeafe" stroke="#1b2942" stroke-width="2.5"/>
<rect x="160" y="74" width="16" height="12" rx="2" fill="#2563eb"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#0b1220">
<text x="628" y="30" text-anchor="end" fill="#1d4ed8">Wide lens:</text>
<text x="628" y="50" text-anchor="end">hands and task in frame</text>
<text x="628" y="300" text-anchor="end" fill="#92400e">Narrow lens:</text>
<text x="628" y="320" text-anchor="end">hands drop out of frame</text>
<text x="420" y="222" text-anchor="middle">task</text>
<text x="266" y="238">hands</text>
<text x="300" y="150" font-size="15" fill="#475569" transform="rotate(35 300 150)">where they look</text>
</g>
</svg>
