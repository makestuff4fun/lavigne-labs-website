<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 300" width="320" height="300" role="img" aria-labelledby="ev-t ev-d">
<title id="ev-t">Egocentric capture: the camera is on the wearer</title>
<desc id="ev-d">Side view of a person working at a bench with a camera on their head. The camera's field of view looks down and forward over their hands and the task on the bench.</desc>
<defs>
<pattern id="ev-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="8" height="8" fill="#e2e8f0"/><line x1="0" y1="0" x2="0" y2="8" stroke="#cbd5e1" stroke-width="2"/></pattern>
</defs>
<rect width="320" height="300" fill="#f4f6fb"/>
<path d="M84 66 L318 120 L318 232 L170 290 Z" fill="#2563eb" fill-opacity="0.13" stroke="#2563eb" stroke-width="1.5" stroke-dasharray="5 4"/>
<rect x="150" y="206" width="160" height="10" fill="url(#ev-hatch)" stroke="#475569" stroke-width="2"/>
<line x1="166" y1="216" x2="166" y2="290" stroke="#475569" stroke-width="2.5"/>
<line x1="294" y1="216" x2="294" y2="290" stroke="#475569" stroke-width="2.5"/>
<rect x="232" y="186" width="34" height="20" rx="2" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
<g fill="#dbeafe" stroke="#1b2942" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
<circle cx="66" cy="76" r="20"/>
<path d="M56 98 L80 98 L86 210 L52 210 Z"/>
<path d="M70 112 L104 168 L190 200" fill="none" stroke-width="7"/>
<line x1="60" y1="210" x2="58" y2="290" stroke-width="7"/>
<line x1="78" y1="210" x2="84" y2="290" stroke-width="7"/>
</g>
<circle cx="194" cy="201" r="7" fill="#dbeafe" stroke="#1b2942" stroke-width="2.5"/>
<rect x="74" y="58" width="16" height="12" rx="2" fill="#2563eb"/>
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" fill="#0b1220">
<text x="12" y="28" font-size="17" font-weight="600">Egocentric (first-person)</text>
<text x="104" y="50" font-size="15">Camera on the wearer</text>
<text x="176" y="178" font-size="15">hands</text>
<text x="246" y="176" font-size="15" text-anchor="middle">task</text>
</g>
</svg>
