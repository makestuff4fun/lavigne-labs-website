<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 270" width="640" height="270" role="img" aria-labelledby="sf-t sf-d">
<title id="sf-t">Why a single event only syncs to the nearest frame</title>
<desc id="sf-d">Two cameras both recording at 30 frames per second, with their frames starting at different moments. A hand hits the table at 72 ms. Camera A's first frame showing it starts at 66.7 ms and camera B's at 81.7 ms, so the two cameras disagree by 15 ms about an event that happened once. The error can be up to one frame, 33 ms at 30 fps.</desc>
<rect width="640" height="270" fill="#f4f6fb"/>
<line x1="262" y1="34" x2="262" y2="206" stroke="#b45309" stroke-width="2.5" stroke-dasharray="6 4"/>
<g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
<rect x="60" y="66" width="28" height="30" rx="2"/><rect x="153" y="66" width="28" height="30" rx="2"/><rect x="340" y="66" width="28" height="30" rx="2"/><rect x="433" y="66" width="28" height="30" rx="2"/><rect x="527" y="66" width="28" height="30" rx="2"/>
<rect x="102" y="136" width="28" height="30" rx="2"/><rect x="195" y="136" width="28" height="30" rx="2"/><rect x="382" y="136" width="28" height="30" rx="2"/><rect x="475" y="136" width="28" height="30" rx="2"/><rect x="569" y="136" width="28" height="30" rx="2"/>
</g>
<g fill="#f59e0b" fill-opacity="0.45" stroke="#b45309" stroke-width="2.5">
<rect x="247" y="66" width="28" height="30" rx="2"/>
<rect x="289" y="136" width="28" height="30" rx="2"/>
</g>
<line x1="60" y1="206" x2="620" y2="206" stroke="#475569" stroke-width="2"/>
<g stroke="#475569" stroke-width="2"><line x1="60" y1="206" x2="60" y2="212"/><line x1="200" y1="206" x2="200" y2="212"/><line x1="340" y1="206" x2="340" y2="212"/><line x1="480" y1="206" x2="480" y2="212"/><line x1="620" y1="206" x2="620" y2="212"/></g>
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#475569">
<text x="60" y="230" text-anchor="middle">0</text><text x="200" y="230" text-anchor="middle">50</text><text x="340" y="230" text-anchor="middle">100</text><text x="480" y="230" text-anchor="middle">150</text><text x="620" y="230" text-anchor="end">200 ms</text>
<text x="340" y="258" text-anchor="middle">Each box is one frame's exposure, 30 frames per second</text>
</g>
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#0b1220">
<text x="270" y="28" fill="#92400e">Hand hits the table: 72 ms</text>
<text x="12" y="58">Camera A</text>
<text x="12" y="128">Camera B</text>
<text x="282" y="116" font-size="15">A first shows it: 66.7 ms</text>
<text x="326" y="186" font-size="15">B first shows it: 81.7 ms</text>
</g>
</svg>
