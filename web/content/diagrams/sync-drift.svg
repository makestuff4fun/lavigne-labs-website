<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" width="640" height="320" role="img" aria-labelledby="sd-t sd-d">
<title id="sd-t">Clock drift between two cameras over an hour</title>
<desc id="sd-d">A plot of the time offset between camera B and camera A against recording time. A cluster of QR readings at the start gives an offset of about 1240 ms, and a cluster at the end, sixty minutes later, about 1312 ms. A straight line through both clusters gives the offset for every frame in between; the 72 ms of drift corresponds to the clocks disagreeing by 20 parts per million.</desc>
<defs>
<marker id="sd-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1b2942"/></marker>
</defs>
<rect width="640" height="320" fill="#f4f6fb"/>
<g stroke="#cbd5e1" stroke-width="1">
<line x1="90" y1="70" x2="600" y2="70"/><line x1="90" y1="115" x2="600" y2="115"/><line x1="90" y1="160" x2="600" y2="160"/><line x1="90" y1="205" x2="600" y2="205"/>
</g>
<line x1="90" y1="250" x2="600" y2="250" stroke="#475569" stroke-width="2"/>
<line x1="90" y1="60" x2="90" y2="250" stroke="#475569" stroke-width="2"/>
<line x1="100" y1="250" x2="590" y2="88" stroke="#2563eb" stroke-width="3"/>
<line x1="540" y1="248" x2="540" y2="108" stroke="#1b2942" stroke-width="2" marker-start="url(#sd-arr)" marker-end="url(#sd-arr)"/>
<g fill="#1b2942">
<circle cx="100" cy="246" r="4"/><circle cx="103" cy="254" r="4"/><circle cx="105" cy="249" r="4"/><circle cx="107" cy="243" r="4"/><circle cx="110" cy="252" r="4"/><circle cx="112" cy="246" r="4"/>
<circle cx="578" cy="96" r="4"/><circle cx="581" cy="88" r="4"/><circle cx="584" cy="93" r="4"/><circle cx="586" cy="85" r="4"/><circle cx="588" cy="91" r="4"/><circle cx="590" cy="84" r="4"/>
</g>
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="15" fill="#475569">
<text x="84" y="75" text-anchor="end">1320</text><text x="84" y="120" text-anchor="end">1300</text><text x="84" y="165" text-anchor="end">1280</text><text x="84" y="210" text-anchor="end">1260</text><text x="84" y="255" text-anchor="end">1240</text>
<text x="100" y="272" text-anchor="middle">0</text><text x="222" y="272" text-anchor="middle">15</text><text x="345" y="272" text-anchor="middle">30</text><text x="468" y="272" text-anchor="middle">45</text><text x="590" y="272" text-anchor="middle">60</text>
<text x="345" y="300" text-anchor="middle">Recording time (minutes)</text>
<text x="18" y="160" text-anchor="middle" transform="rotate(-90 18 160)">Offset, B minus A (ms)</text>
</g>
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#0b1220">
<text x="124" y="232">QR at the start</text>
<text x="568" y="70" text-anchor="end">QR at the end</text>
<text x="300" y="206">Every frame in between</text>
<text x="300" y="226">reads its offset off this line</text>
<text x="548" y="186">72 ms</text>
<text x="548" y="206">of drift</text>
</g>
</svg>
