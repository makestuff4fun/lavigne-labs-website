<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#0b1220">
<text x="166" y="34" text-anchor="end">Head camera</text>
<text x="166" y="54" text-anchor="end" fill="#475569" font-size="15">wide lens, sees the task</text>
<text x="146" y="122" text-anchor="end">Eye tracker</text>
<text x="146" y="142" text-anchor="end" fill="#475569" font-size="15">where they look</text>
<text x="126" y="200" text-anchor="end">Microphones</text>
<text x="146" y="294" text-anchor="end">Wrist camera</text>
<text x="146" y="314" text-anchor="end" fill="#475569" font-size="15">optional: the grip</text>
<text x="474" y="34">IMU</text>
<text x="474" y="54" fill="#475569" font-size="15">head motion</text>
<text x="484" y="190">Chest camera</text>
<text x="484" y="210" fill="#475569" font-size="15">optional: steadier</text>
<text x="484" y="228" fill="#475569" font-size="15">view of the hands</text>
