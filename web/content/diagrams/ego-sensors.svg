<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-labelledby="es-t es-d">
<title id="es-t">A typical egocentric capture rig</title>
<desc id="es-d">Front view of a wearer. A wide-angle camera sits at the bridge of the glasses, with eye-tracking cameras facing the eyes, microphones and an IMU at the temples. Optional extras: a chest camera and a camera on each wrist.</desc>
