<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="eb-t eb-d">
<title id="eb-t">Motion blur from a turning head, by exposure time</title>
<desc id="eb-d">With the head turning at 100 degrees per second and 1920 pixels across a 120 degree view, about 16 pixels per degree, an exposure of 1/30 s smears each point across about 53 pixels, 1/60 s about 27, 1/250 s about 6 and 1/1000 s about 2.</desc>
<rect width="640" height="300" fill="#f4f6fb"/>
<line x1="130" y1="52" x2="130" y2="276" stroke="#475569" stroke-width="2"/>
<g fill="#2563eb">
<rect x="130" y="62" width="400" height="26" rx="3" fill-opacity="0.85"/>
<rect x="130" y="118" width="200" height="26" rx="3" fill-opacity="0.85"/>
<rect x="130" y="174" width="48" height="26" rx="3" fill-opacity="0.85"/>
<rect x="130" y="230" width="12" height="26" rx="3" fill-opacity="0.85"/>
</g>
<g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="17" fill="#0b1220">
<text x="16" y="30" font-size="15" fill="#475569">Head turning at 100°/s · 1920 px across a 120° view ≈ 16 px per degree</text>
<text x="118" y="81" text-anchor="end">1/30 s</text>
<text x="118" y="137" text-anchor="end">1/60 s</text>
<text x="118" y="193" text-anchor="end">1/250 s</text>
<text x="118" y="249" text-anchor="end">1/1000 s</text>
<text x="542" y="81">≈ 53 px</text>
<text x="342" y="137">≈ 27 px</text>
<text x="190" y="193">≈ 6 px</text>
<text x="154" y="249">≈ 2 px</text>
<text x="16" y="292" font-size="15" fill="#475569">Exposure time</text>
<text x="630" y="292" font-size="15" fill="#475569" text-anchor="end">Length of the smear in the image</text>
</g>
</svg>
